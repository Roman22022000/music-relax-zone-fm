<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>MultiTouch Music Grid</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101010;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    touch-action:none;
}

.info{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;

    padding:12px;

    color:white;

    background:rgba(0,0,0,0.45);

    border-radius:14px;

    font-family:Arial,sans-serif;

    text-align:center;

    z-index:10;

    backdrop-filter:blur(10px);
}

</style>
</head>
<body>

<div class="info">
    Проводи несколькими пальцами одновременно
</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w,h,dpr;

let cellSize;
let cols;
let rows;

function resize(){

    dpr = window.devicePixelRatio || 1;

    w = innerWidth;
    h = innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;

    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);

    if(w < 600){
        cellSize = 30;
    }else{
        cellSize = 42;
    }

    cols = Math.ceil(w / cellSize);
    rows = Math.ceil(h / cellSize);

    draw();
}

const colors = [
"#ff4d6d",
"#ff914d",
"#ffd84d",
"#6dff4d",
"#4dffd2",
"#4da6ff",
"#7a6dff",
"#c24dff"
];

const notes = [
130.81,
146.83,
164.81,
174.61,
196.00,
220.00,
246.94,
261.63,
293.66,
329.63,
349.23,
392.00,
440.00,
523.25
];

const activePointers = new Map();

function draw(){

    ctx.clearRect(0,0,w,h);

    for(let y=0;y<rows;y++){

        for(let x=0;x<cols;x++){

            const px = x * cellSize;
            const py = y * cellSize;

            let active = false;

            activePointers.forEach((p)=>{

                const cx = px + cellSize/2;
                const cy = py + cellSize/2;

                const dist = Math.hypot(
                    p.x - cx,
                    p.y - cy
                );

                if(dist < cellSize * 0.9){
                    active = true;
                }
            });

            ctx.fillStyle = active
            ? colors[(x+y)%colors.length]
            : "#181818";

            ctx.fillRect(
                px,
                py,
                cellSize,
                cellSize
            );

            ctx.strokeStyle = active
            ? "rgba(255,255,255,0.35)"
            : "rgba(255,255,255,0.05)";

            ctx.strokeRect(
                px,
                py,
                cellSize,
                cellSize
            );
        }
    }
}

const AudioContextClass =
window.AudioContext || window.webkitAudioContext;

const audioCtx = new AudioContextClass();

function playTone(freq){

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.18,
        audioCtx.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + 0.25
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(audioCtx.currentTime + 0.3);
}

const playedCells = new Set();

function triggerCell(x,y){

    const gx = Math.floor(x / cellSize);
    const gy = Math.floor(y / cellSize);

    const key = gx + "_" + gy;

    if(!playedCells.has(key)){

        playedCells.add(key);

        const noteIndex =
        (gx + gy) % notes.length;

        playTone(notes[noteIndex]);

        setTimeout(()=>{

            playedCells.delete(key);

        },60);
    }
}

function updatePointer(id,x,y){

    activePointers.set(id,{x,y});

    triggerCell(x,y);

    draw();
}

function removePointer(id){

    activePointers.delete(id);

    draw();
}

canvas.addEventListener("pointerdown",(e)=>{

    e.preventDefault();

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }

    canvas.setPointerCapture(e.pointerId);

    updatePointer(
        e.pointerId,
        e.clientX,
        e.clientY
    );

});

canvas.addEventListener("pointermove",(e)=>{

    if(activePointers.has(e.pointerId)){

        updatePointer(
            e.pointerId,
            e.clientX,
            e.clientY
        );
    }

});

canvas.addEventListener("pointerup",(e)=>{

    removePointer(e.pointerId);

});

canvas.addEventListener("pointercancel",(e)=>{

    removePointer(e.pointerId);

});

window.addEventListener("resize",resize);

resize();

</script>

</body>
</html>
